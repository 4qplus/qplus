name: Build and Release qplus Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official PHP Windows x64 NTS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $relJson = Invoke-RestMethod -Uri "https://windows.php.net/downloads/releases/releases.json"
          $latestKey = ($relJson.PSObject.Properties.Name | Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
          $release = $relJson.$latestKey
          $ntsKey = ($release.PSObject.Properties.Name | Where-Object { $_ -match '^nts-.*-x64$' } | Select-Object -First 1)
          if (-not $ntsKey) { throw "Could not find NTS x64 PHP build in releases.json" }
          $zipName = $release.$ntsKey.zip.path
          $url = "https://windows.php.net/downloads/releases/$zipName"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "php.zip"
          Expand-Archive -Path "php.zip" -DestinationPath "php" -Force
          Remove-Item "php.zip" -Force

      - name: Build qplus_setup.exe
        shell: powershell
        run: |
          & .\installer\build_installer.ps1

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path ".\installer\qplus_setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  qplus_setup.exe" | Out-File -FilePath ".\installer\qplus_setup.exe.sha256" -Encoding ascii

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qplus-installer
          path: |
            installer/qplus_setup.exe
            installer/qplus_setup.exe.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/qplus_setup.exe
            installer/qplus_setup.exe.sha256

